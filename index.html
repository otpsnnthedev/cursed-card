<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firestore Test</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 30px; text-align: center; }
  #result { font-size: 24px; font-weight: bold; margin-top: 30px; padding: 20px; border-radius: 10px; }
  .pending { background: #333; }
  .pass { background: #14532d; color: #6ee7b7; }
  .fail { background: #4c0519; color: #fda4af; }
  button { font-size: 18px; padding: 12px 24px; border-radius: 8px; border: none; background: #4f46e5; color: white; cursor: pointer; }
  pre { text-align: left; background: #000; padding: 15px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <h1>Firestore Isolated Write Test</h1>
  <p>This page has nothing to do with the game. It only tests your Firebase project.</p>
  <button onclick="runTest()">Run SDK Test</button>
  <button onclick="runRestTest()">Run Plain REST Test</button>
  <div id="result" class="pending">Click a button above</div>
  <pre id="log"></pre>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCAs2_nRX9mzM_e0hu3Y3lGTqBjCuPsisQ",
    authDomain: "cursedcardbyotpsnn.firebaseapp.com",
    projectId: "cursedcardbyotpsnn",
    storageBucket: "cursedcardbyotpsnn.firebasestorage.app",
    messagingSenderId: "55235993705",
    appId: "1:55235993705:web:297658c5f1d7959ff402f8"
  };

  const logEl = document.getElementById('log');
  const resultEl = document.getElementById('result');

  function log(msg) {
    logEl.textContent += msg + "\n";
    console.log(msg);
  }

  function setResult(cls, text) {
    resultEl.className = cls;
    resultEl.textContent = text;
  }

  async function runTest() {
    logEl.textContent = "";
    setResult('pending', 'Running...');

    try {
      log("Step 1: Initializing Firebase app...");
      const app = firebase.initializeApp(firebaseConfig);
      log("OK - app initialized: " + app.name);

      log("Step 2: Getting Firestore instance...");
      const db = firebase.firestore();
      log("OK - firestore instance created");

      log("Step 3: Attempting to write a test document...");
      const docId = 'test-' + Date.now();

      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("TIMEOUT: no response from Firestore after 20 seconds")), 20000)
      );

      const writePromise = db.collection('_diagnostic').doc(docId).set({
        createdAt: Date.now(),
        test: true
      });

      await Promise.race([writePromise, timeoutPromise]);
      log("OK - write succeeded! Document ID: " + docId);
      setResult('pass', '✅ PASS - Firestore write succeeded');

    } catch (err) {
      log("FAILED");
      log("Error name: " + (err.name || 'n/a'));
      log("Error code: " + (err.code || 'n/a'));
      log("Error message: " + (err.message || err));
      log("Full error object: " + JSON.stringify(err, Object.getOwnPropertyNames(err)));
      setResult('fail', '❌ FAIL - see details below');
    }
  }

  async function runRestTest() {
    logEl.textContent = "";
    setResult('pending', 'Running plain REST test...');
    const docId = 'resttest-' + Date.now();
    const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/_diagnostic?documentId=${docId}&key=${firebaseConfig.apiKey}`;

    try {
      log("Sending plain fetch() POST directly to Firestore REST API...");
      log("URL: " + url);

      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("TIMEOUT: plain fetch got no response after 15 seconds")), 15000)
      );

      const fetchPromise = fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { test: { booleanValue: true }, createdAt: { integerValue: Date.now() } } })
      });

      const res = await Promise.race([fetchPromise, timeoutPromise]);
      log("Got an HTTP response! Status: " + res.status + " " + res.statusText);
      const body = await res.text();
      log("Response body: " + body);

      if (res.ok) {
        setResult('pass', '✅ PASS - Plain REST write succeeded (status ' + res.status + ')');
      } else {
        setResult('fail', '❌ FAIL - Firestore responded but rejected it (status ' + res.status + ')');
      }
    } catch (err) {
      log("FAILED");
      log("Error name: " + (err.name || 'n/a'));
      log("Error message: " + (err.message || err));
      setResult('fail', '❌ FAIL - request never completed');
    }
  }
</script>
</body>
</html>
